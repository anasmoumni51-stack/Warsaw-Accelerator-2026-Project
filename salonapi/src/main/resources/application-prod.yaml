spring:
  application:
    name: salonapi

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

app:
  cors:
    origin: ${CORS_ORIGIN:*}

